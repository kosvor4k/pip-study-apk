name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Auto-Prepare Project Structure
        run: |
          mkdir -p www
          # Если index.html лежит в корне или в подпапке, копируем его в www/index.html
          if [ ! -f "www/index.html" ]; then
            FOUND_HTML=$(find . -maxdepth 3 -name "*.html" | head -n 1)
            if [ -n "$FOUND_HTML" ]; then
              cp "$FOUND_HTML" www/index.html
            else
              echo "<h1>PIP-STUDY 3000</h1><p>Файл index.html не найден в репозитории!</p>" > www/index.html
            fi
          fi

          # Автоматически создаем package.json
          cat << 'EOF' > package.json
          {
            "name": "pip-study-3000",
            "version": "1.0.0",
            "description": "PIP-STUDY 3000 RPG Study Tracker",
            "main": "www/index.html",
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          EOF

          # Автоматически создаем capacitor.config.json
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "ru.pipstudy.terminal",
            "appName": "PIP-STUDY 3000",
            "webDir": "www",
            "bundledWebRuntime": false,
            "android": {
              "backgroundColor": "#050a06",
              "allowMixedContent": true
            }
          }
          EOF

      - name: 6. Install Dependencies & Generate Android Project
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: 7. Build APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 8. Upload Ready APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PIP-STUDY-3000-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

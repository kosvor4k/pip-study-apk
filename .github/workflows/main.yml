name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Setup Java JDK 17 (Required for Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Install Dependencies & Generate Android Project
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: 6. Build APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 7. Upload Ready APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PIP-STUDY-3000-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
